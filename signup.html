<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <link rel="stylesheet" href="styles/style.css"/>
  <title>SIGN UP FORM</title>
  <link rel="stylesheet" href="signup.css"/>
</head>
<body>
  <form>
  <h1>
    Sign Up
  </h1>
  <p id="text">Please fill in this form to create an account!</p>
    <p id="names">
      <h2></h2>
    <input type="text" id="fname" placeholder="First Name" required="name"/>
    <input type="text" id="lname" placeholder="Last Name"/>
    </p>
    <p><input type="email" id="email" placeholder="Email" autocomplete="email"/></p>
    <p><input type="password" id="password" name="pwd" placeholder="Password" required/></p>
    <p><input type="password" id="cpassword" name="pwd" placeholder="Confirm password"></p>
    <input type="checkbox" id=checkbox required/>
    <label id="pp" for="checkbox" ><span id="on">I accept the <a href="#">Terms of use & privacy policy</span></a></label>
    <p><button id="submit" name="sign up"><a href="login.html">Sign up</a></button></p>
    </form>
  <p id="login">Already have an account? <span id="off"><a href="login.html">Login here</a></span></p>
</body>
</html>
